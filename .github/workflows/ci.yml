name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Portmark.Cli/Portmark.Cli.csproj tests/Portmark.Core.Tests/Portmark.Core.Tests.csproj

      - name: Build
        run: dotnet build src/Portmark.Cli/Portmark.Cli.csproj -c Release --no-restore

      # The decoders run on captured byte vectors, so the whole suite passes on a runner with
      # no USB-C hardware attached. Anything that needs real hardware stays out of CI by design.
      - name: Test
        run: dotnet test tests/Portmark.Core.Tests/Portmark.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish single-file executable
        run: dotnet publish src/Portmark.Cli/Portmark.Cli.csproj -c Release -o dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: portmark-win-x64
          path: dist/portmark.exe
          if-no-files-found: error
