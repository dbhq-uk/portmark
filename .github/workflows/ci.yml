name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # One project per invocation for restore, so the whole thing goes through the solution.
      - name: Restore
        run: dotnet restore Portmark.slnx

      - name: Build
        run: dotnet build Portmark.slnx -c Release --no-restore

      # The decoders run on captured byte vectors, so the whole suite passes on a runner with
      # no USB-C hardware attached. Anything that needs real hardware stays out of CI by design.
      - name: Test
        run: dotnet test Portmark.slnx -c Release --no-restore --verbosity normal

      - name: Publish single-file executable
        run: dotnet publish src/Portmark.Cli/Portmark.Cli.csproj -c Release -o dist

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portmark-win-x64
          path: dist/portmark.exe
          if-no-files-found: error
